name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint:
    name: Build, Test, and Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,science]"

      - name: Run Ruff (lint and format check)
        run: |
          uv run ruff check galform_analysis
          uv run ruff format --check galform_analysis

      - name: Run tests
        run: |
          uv run pytest tests -v --tb=short

      - name: Build package
        run: |
          uv build
