name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test before release (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,science]"

      - name: Run tests
        run: |
          uv run pytest tests -v --tb=short

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: release
      url: https://pypi.org/p/galform_analysis
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev

      - name: Build package
        run: |
          uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # To use this, you must set up Trusted Publishing on PyPI:
        # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
        # Project Name: galform_analysis
        # Workflow Name: release.yml
        # Environment Name: release
        with:
          skip-existing: true
