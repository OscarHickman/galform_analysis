[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galform_analysis"
dynamic = ["version"]
description = "A modular Python framework for reading and analyzing GALFORM HDF5 simulation outputs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Oscar Hickman", email = "oscar.hickman17@alumni.imperial.ac.uk"},
]
keywords = [
    "galform",
    "semi-analytic model",
    "galaxy formation",
    "cosmology",
    "hdf5",
    "stellar mass function",
    "halo mass function",
    "halo occupation distribution",
    "correlation function",
    "redshift-space distortions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23.0",
    "matplotlib>=3.3.0",
    "polars>=1.0.0",
    "h5py>=3.0.0",
    "galform_execution>=0.2.4",
]

[project.optional-dependencies]
# Correlation functions and RSD multipoles. Corrfunc has no wheels on PyPI and
# compiles from source: it needs a C compiler with OpenMP and GSL headers.
clustering = [
    "Corrfunc>=2.3.0",
]
# Theoretical predictions: halo mass functions and the linear matter xi(r).
science = [
    "scipy>=1.7.0",
    "hmf>=3.0",
    "astropy>=5.0",
    "camb>=1.0",
    "colossus>=1.3.0",
]
all = [
    "galform_analysis[clustering,science]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/OscarHickman/galform_analysis"
Repository = "https://github.com/OscarHickman/galform_analysis"
Issues = "https://github.com/OscarHickman/galform_analysis/issues"
Changelog = "https://github.com/OscarHickman/galform_analysis/blob/main/CHANGELOG.md"
Documentation = "https://github.com/OscarHickman/galform_analysis#readme"

[tool.setuptools.dynamic]
version = {attr = "galform_analysis.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["galform_analysis*"]

[tool.setuptools.package-data]
galform_analysis = ["py.typed", "redshift_lists/*.txt", "sim_configs/*.json"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["galform_analysis"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
